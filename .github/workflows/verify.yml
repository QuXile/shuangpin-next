name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch build-time jieba dictionary
        run: |
          mkdir -p data/raw
          curl -fsSL https://raw.githubusercontent.com/fxsjy/jieba/master/jieba/dict.txt -o data/raw/jieba-dict.txt
      - run: pnpm verify
